<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep Ocean Kanban</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-title">
      <h1>Deep Ocean Kanban</h1>
    </div>
    <div class="header-actions">
      <button id="btn-backup-download" class="btn btn-action" onclick="downloadBackup()">
        ⬇️ Backup Downloaden
      </button>
      <button id="btn-backup-upload" class="btn btn-action" onclick="triggerUpload()">
        ⬆️ Backup Uploaden
      </button>
      <button id="btn-toggle-music" class="btn btn-icon" onclick="toggleMusic()" title="Achtergrondmuziek aan/uit">
        🎵
      </button>
      <input type="file" id="file-import" accept=".json" style="display: none;" onchange="uploadBackup(event)">
    </div>
  </header>

  <main class="container">
    
    <!-- Totale Voortgang (Bovenaan) -->
    <section class="progress-section card">
      <h2>Totale Voortgang</h2>
      <div class="progress-bar-container">
        <div id="total-progress-bar" class="progress-bar-fill" style="width: 0%;">0%</div>
      </div>
      <div id="phase-monitors" class="phase-monitors-grid">
        <!-- Fasemonitors worden dynamisch via JS geladen -->
      </div>
    </section>

    <!-- Taak Invoerformulier -->
    <section class="task-form-section card">
      <h2>Nieuwe Taak Toevoegen</h2>
      <form id="task-form" onsubmit="handleAddTask(event)">
        <div class="form-grid">
          <div class="form-group">
            <label for="task-title">Titel *</label>
            <input type="text" id="task-title" required placeholder="Wat moet er gebeuren?">
          </div>

          <div class="form-group">
            <label for="task-assignee">Wie is hiermee bezig?</label>
            <input type="text" id="task-assignee" placeholder="Naam of teamlid">
          </div>

          <div class="form-group">
            <label for="task-phase">Fase</label>
            <select id="task-phase">
              <option value="Fase 1 – Voorbereiding">Fase 1 – Voorbereiding</option>
              <option value="Fase 2 – Ontwerp en structuur">Fase 2 – Ontwerp en structuur</option>
              <option value="Fase 3 – Beheer en basisinformatie">Fase 3 – Beheer en basisinformatie</option>
              <option value="Fase 4–6 – Inhoud en extra functies">Fase 4–6 – Inhoud en extra functies</option>
              <option value="Fase 7 – Oplevering">Fase 7 – Oplevering</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task-duedate">Vervaldatum</label>
            <input type="date" id="task-duedate">
          </div>
        </div>

        <div class="form-group full-width">
          <label for="task-desc">Beschrijving</label>
          <textarea id="task-desc" rows="2" placeholder="Optionele details..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">+ Taak Toevoegen</button>
      </form>
    </section>

    <!-- Kanban Board -->
    <section class="kanban-board">
      
      <!-- To Do Kolom -->
      <div class="kanban-column" id="col-todo" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'todo')">
        <div class="column-header">
          <h3>Te Doen (To Do)</h3>
          <span id="count-todo" class="badge">0</span>
        </div>
        <div class="task-list" id="list-todo"></div>
      </div>

      <!-- Doing Kolom -->
      <div class="kanban-column" id="col-doing" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'doing')">
        <div class="column-header">
          <h3>Bezig (Doing)</h3>
          <span id="count-doing" class="badge">0</span>
        </div>
        <div class="task-list" id="list-doing"></div>
      </div>

      <!-- Done Kolom -->
      <div class="kanban-column" id="col-done" ondragover="allowDrop(event)" ondrop="handleDrop(event, 'done')">
        <div class="column-header">
          <h3>Klaar (Done)</h3>
          <span id="count-done" class="badge">0</span>
        </div>
        <div class="task-list" id="list-done"></div>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
